name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: medicart
          POSTGRES_USER: medicart
          POSTGRES_PASSWORD: medicart
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U medicart -d medicart"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://medicart:medicart@localhost:5432/medicart?schema=public
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:3000
      STORAGE_DRIVER: local
      REQUIRE_REMOTE_STORAGE_IN_PRODUCTION: 'false'
      PAYMENT_PROVIDER: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
