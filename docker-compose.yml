services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: medicart
      POSTGRES_USER: medicart
      POSTGRES_PASSWORD: medicart
    ports:
      - "5432:5432"
    volumes:
      - medicart_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicart -d medicart"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - medicart_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  medicart_pg:
  medicart_redis:
